name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(python -c "import runpy; print(runpy.run_path('src/bdo_toolkit/_version.py')['__version__'])")"
          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "The origin/main reference is unavailable; refusing to publish." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} must point to a commit contained in main." >&2
            exit 1
          fi

      - name: Install release tooling
        run: python -m pip install --upgrade ".[dev]" build twine

      - name: Run release tests
        run: python -m pytest -q -W error -p no:cacheprovider

      - name: Type check
        run: python -m mypy src/bdo_toolkit

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Validate distribution contents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = tuple(dist.glob("bdo_toolkit-*.whl"))
          sdists = tuple(dist.glob("bdo_toolkit-*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"expected one wheel and one source distribution; "
                  f"found {len(wheels)} wheel(s) and {len(sdists)} sdist(s)"
              )

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = archive.namelist()
          if "bdo_toolkit/py.typed" not in wheel_names:
              raise SystemExit("wheel is missing py.typed")
          if any(name.endswith("/data/opcodes.json") for name in wheel_names):
              raise SystemExit("bundled opcode profile must not ship")

          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_names = archive.getnames()
          if not any(name.endswith("/src/bdo_toolkit/py.typed") for name in sdist_names):
              raise SystemExit("source distribution is missing py.typed")
          if any(name.endswith("/data/opcodes.json") for name in sdist_names):
              raise SystemExit("bundled opcode profile must not ship")
          PY

      - name: Smoke-test the exact wheel
        shell: bash
        run: |
          set -euo pipefail
          smoke="${RUNNER_TEMP}/bdo-toolkit-wheel-smoke"
          python -m venv "${smoke}"
          "${smoke}/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          "${smoke}/bin/python" -m pip check
          EXPECTED_VERSION="${GITHUB_REF_NAME#v}" "${smoke}/bin/python" - <<'PY'
          import os

          import bdo_toolkit

          assert bdo_toolkit.__version__ == os.environ["EXPECTED_VERSION"]
          assert bdo_toolkit.OPCODE_PROFILE_SCHEMA_VERSION == 1
          assert not hasattr(bdo_toolkit, "default_profile_path")
          assert callable(bdo_toolkit.fetch_opcode_profile)
          PY
          "${smoke}/bin/bdo-toolkit" --version
          "${smoke}/bin/bdo-toolkit" profile fetch --help

      - name: Store distributions for the publishing job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bdo-toolkit/
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
