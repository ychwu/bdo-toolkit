name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q -W error
      - name: Type check
        run: mypy src/bdo_toolkit
      - name: Build wheel
        run: pip wheel . --no-deps --wheel-dir dist
      - name: Smoke-test CLI
        run: bdo-toolkit --version
